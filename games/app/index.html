<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Baby Cheetah">
<meta name="theme-color" content="#DDF1F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.BABY_CHEETAH_SYNC="https://baby-cheetah-save.fly.dev";</script>
<title>Baby Cheetah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen app. A calm storybook trail that climbs upward; every stop opens one quiet, full-screen game. Single light look by choice. */
:root{
  --sky:#DDF1F5; --paper:#FFFDF7; --ink:#1F3044; --soft:#5C7186; --line:#BFDCE3;
  --sun:#F7B731; --sun-d:#C98A12; --fox:#E8743B; --fox-d:#B9531F; --leaf:#4CA774; --leaf-d:#357A54; --berry:#7A5CC2; --berry-d:#57409A;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--sky);color:var(--ink);font:600 17px/1.35 var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
.screen{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:8px 22px;border-radius:20px;
  background:var(--paper);box-shadow:0 5px 0 var(--line);font:800 1.15rem var(--display)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--fox);color:#fff;box-shadow:0 5px 0 var(--fox-d)}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}
.btn.purple{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-d)}
.btn[disabled]{opacity:.45}
.round{width:52px;min-height:52px;padding:0;border-radius:50%;font-size:1.4rem;flex:none}
.bar{display:flex;align-items:center;gap:12px;flex:none}
.bar h2{font-size:1.5rem;flex:1;min-width:0}
.stars{font:800 1.2rem var(--display);background:var(--paper);border-radius:99px;padding:6px 14px}

/* home */
#home{align-items:center;justify-content:center;text-align:center;gap:18px;background:linear-gradient(#BFE6F2,var(--sky) 55%,#CFEBB8)}
#home .hero{font:88px/1 var(--emoji);white-space:nowrap;width:100%}
#home .hero img{width:min(34vw,150px);height:min(34vw,150px);vertical-align:bottom}
#home .hero img.baby{width:min(24vw,106px);height:min(24vw,106px)}
.fox img.baby{width:50px;height:50px;display:block;margin-top:-6px}
.summit img{width:46px;height:46px}
#home h1{font-size:clamp(2.1rem,7.5vw,3.6rem);color:var(--fox-d)}
#home p{margin:0;color:var(--soft);max-width:24ch}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,400px)}
.menu .btn{width:100%;font-size:1.08rem;min-height:56px;padding:6px 8px}
.menu #goMap,.menu #goBank{grid-column:1/-1;font-size:1.3rem}
.btn.blue{background:#3F7FD1;color:#fff;box-shadow:0 5px 0 #2C5FA3}
/* math */
.eq{font:800 clamp(2.4rem,11vmin,4.2rem)/1 var(--display);display:flex;gap:.3em;align-items:center;flex:none}
.eq .q{color:var(--fox);border-bottom:5px solid var(--fox);min-width:1.2em;text-align:center}
.eq .ok2{color:var(--leaf-d);border-bottom:5px solid var(--leaf);min-width:1.2em;text-align:center}
.mpic{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:76px;font:800 1.6rem var(--display);flex:none}
.dots2{display:grid;grid-template-columns:repeat(5,22px);gap:5px}
.dots2 i{width:22px;height:22px;border-radius:50%;background:var(--berry)}
.dots2 i.b{background:var(--sun)}
.dots2 i.gone{background:none;border:3px dashed var(--line)}
.blocks{display:flex;gap:4px;align-items:flex-end}
.blocks .ten{width:13px;height:70px;border-radius:4px;background:var(--berry) repeating-linear-gradient(transparent 0 6px,rgba(255,255,255,.5) 6px 7px)}
.blocks .ones{display:flex;flex-direction:column-reverse;flex-wrap:wrap;height:70px;gap:2px 4px}
.blocks .ones i{width:12px;height:12px;border-radius:3px;background:var(--sun)}
.mlev{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:4px 2px 12px}
.mlev button{border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line);padding:12px 8px;font:800 1.1rem/1.15 var(--display);display:flex;flex-direction:column;gap:4px;align-items:center}
.mlev small{font:600 .95rem var(--body);color:var(--soft)}
.mlev .done{background:#E3F4DC;box-shadow:0 0 0 3px var(--leaf) inset}
.btn.sun{background:var(--sun);box-shadow:0 5px 0 var(--sun-d)}
/* ABC letters */
.abctabs{display:flex;gap:8px;flex:none;overflow-x:auto;padding-bottom:6px}
.tab{min-height:46px;padding:4px 18px;font-size:1.05rem;flex:none}
.tab.on{background:var(--ink);color:#fff;box-shadow:0 5px 0 #0E1A28}
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;padding:4px 2px 12px}
.abcl,.abcw{border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line);font:700 2.2rem Andika,var(--display)}
.abcl{aspect-ratio:1;font-size:1.7rem}
.abcw{padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.25rem}
.abcw span{font:34px/1.1 var(--emoji)}
.abcl.done,.abcw.done{background:#E3F4DC;box-shadow:0 0 0 3px var(--leaf) inset}
.abctop{font:700 2rem/1 Andika,var(--display);display:flex;gap:8px;flex:none}
.abctop span{opacity:.35}
.abctop .got{opacity:1;color:var(--leaf-d)}
.abctop .now{opacity:1;color:var(--fox-d)}
.stage{flex:1;min-height:0;align-self:stretch;display:grid;place-items:center}
.tracecv{touch-action:none;border-radius:24px;box-shadow:0 0 0 4px #fff,0 6px 0 var(--line)}
.abccard{min-height:2.8em;font:800 1.25rem/1.2 var(--display);text-align:center;flex:none}
.abccard span{font:40px/1 var(--emoji);margin:0 6px;vertical-align:middle}
.bigl{font:700 clamp(3rem,14vmin,6rem)/1 Andika,var(--display);color:var(--fox-d)}
/* pop-up pickers that float over the bottom of the drawing sheet */
.pop{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;background:var(--paper);border-radius:16px;padding:8px;box-shadow:0 4px 14px rgba(31,48,68,.3);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:62%;overflow-y:auto;touch-action:pan-y}
.tool.sm{width:34px;height:34px}
.guide{position:absolute;left:6%;top:6%;width:88%;height:88%;pointer-events:none;z-index:1}
.guide path{fill:none;stroke:#6F8796;stroke-width:1.1;stroke-dasharray:2.4 2;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.gpick{width:60px;height:60px;border-radius:14px}
.gpick svg{width:46px;height:46px}
.gpick path{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.gnone{min-height:46px;padding:4px 14px;font-size:1rem;width:100%}
.anycol{width:52px;height:34px;border:0;padding:0;background:none}
#gear{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}

/* map */
#mapScroll{flex:1;min-height:0;overflow-y:auto;border-radius:24px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#trail{position:relative;max-width:560px;margin:0 auto}
#trail svg{position:absolute;inset:0;width:100%;height:100%}
#trail path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-dasharray:2 22;vector-effect:non-scaling-stroke;opacity:.9}
.band{position:absolute;left:0;right:0}
.wname{position:absolute;left:14px;bottom:10px;font:800 1.2rem var(--display);opacity:.75}
.band.dark .wname{color:#fff}
.node{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--paper);border:4px solid #fff;
  box-shadow:0 5px 0 rgba(31,48,68,.25);font:30px/1 var(--emoji);display:grid;place-items:center}
.node.done{background:var(--sun)}
.node.done::after{content:"⭐";position:absolute;right:-10px;top:-10px;font-size:22px}
.node.lock{filter:grayscale(1);opacity:.55}
.node.cur{animation:pulse 2.4s ease-in-out infinite}
.fox{position:absolute;left:50%;top:-42px;transform:translateX(-50%);font-size:34px;white-space:nowrap;pointer-events:none}
.summit{position:absolute;left:50%;top:26px;transform:translateX(-50%);font:54px/1 var(--emoji)}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(31,48,68,.25),0 0 0 10px rgba(255,255,255,.55)}}

/* play */
#hint{flex:1;min-width:0;font:800 clamp(1.2rem,3.2vw,1.6rem)/1.2 var(--display);background:var(--paper);border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 var(--line);text-wrap:balance}
.area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative}
.area.row{flex-direction:row;gap:28px}
.box{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dots{display:flex;gap:10px;flex:none}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun-d)}
.grid{display:grid;grid-template-columns:repeat(var(--n),var(--c));grid-auto-rows:var(--c);gap:8px;flex:none}
.cell,.hold{width:var(--c);height:var(--c)}
.cell{display:grid;place-items:center;font:calc(var(--c)*.6)/1 var(--emoji);border-radius:18%}
.card{background:var(--berry);box-shadow:0 4px 0 var(--berry-d)}
.card span{visibility:hidden}
.card.up{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.card.up span{visibility:visible}
.card.ok,.ok{background:#E3F4DC;box-shadow:0 0 0 3px var(--leaf) inset}
.slot{background:rgba(255,255,255,.55);border:3px dashed var(--line);position:relative}
.sil{filter:brightness(0);opacity:.3}
.piece{position:relative;background:var(--paper);box-shadow:0 4px 0 var(--line);cursor:grab;transition:transform .18s;touch-action:none}
.piece.drag{transition:none;z-index:20;box-shadow:0 10px 18px rgba(31,48,68,.25)}
.board{gap:0;background:var(--paper);border-radius:10px;box-shadow:0 0 0 4px #fff}
.board .slot{border:1px dashed var(--line);border-radius:0;background:none}
.ghost{position:absolute;inset:0;opacity:.28}
.tile{border-radius:6px;background-color:var(--paper);background-repeat:no-repeat}
.board .tile{box-shadow:none;border-radius:0}
.bins{display:flex;gap:10px;width:100%;max-width:760px;flex:none}
.bin{flex:1;min-width:0;min-height:calc(var(--c)*1.7);background:var(--paper);border:3px dashed var(--line);border-radius:18px;padding:6px;text-align:center}
.bin b{display:block;font:800 1rem/1.1 var(--display)}
.binin{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding-top:4px}
.mini{width:calc(var(--c)*.5);height:calc(var(--c)*.5);font-size:calc(var(--c)*.36);box-shadow:none;background:none}
.hole{background:var(--paper);border:3px dashed var(--fox);font-family:var(--display);color:var(--fox)}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{width:clamp(64px,19vmin,104px);height:clamp(64px,19vmin,104px);border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--line);
  font:clamp(34px,10vmin,56px)/1 var(--emoji);display:grid;place-items:center}
.choice.num{font-family:var(--display);font-weight:800}
.tap{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.no{animation:wob .4s}
@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scatter{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;max-width:560px;font:clamp(30px,8vmin,54px)/1.1 var(--emoji)}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:240px;padding:8px;border-radius:16px;background:rgba(255,255,255,.6)}
.scatter b{font:800 1.2em var(--display)}
.dotsvg{touch-action:none;background:var(--paper);border-radius:24px;flex:none}
.dfill{fill:var(--sun);opacity:0;transition:opacity .8s}
.dfill.on{opacity:.85}
.dline{fill:none;stroke:var(--fox);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.drub{stroke:var(--fox);stroke-width:1;stroke-dasharray:2 2;opacity:.6}
.dot circle{fill:var(--paper);stroke:var(--ink);stroke-width:.6}
.dot text{font:800 4.4px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot.on circle{fill:var(--fox);stroke:var(--fox-d)}
.dot.on text{fill:#fff}
.dot.next circle{fill:var(--sun);stroke-width:1}
.mazecv{touch-action:none;border-radius:16px;flex:none}
.mos{gap:2px;touch-action:none}
.px{background:var(--paper);border-radius:4px;font:800 calc(var(--c)*.45)/1 var(--display);color:var(--soft)}
.pal{display:flex;gap:14px;flex:none}
.sw{width:60px;height:60px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.sw i{font:800 1.1rem var(--display);font-style:normal;background:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.sw.sel,.tool.sel,.morecol.sel{outline:4px solid var(--ink);outline-offset:2px}
.pad{border-radius:26%;opacity:.55;box-shadow:0 6px 0 rgba(31,48,68,.2);transition:opacity .15s,transform .15s}
.pad.lit{opacity:1;transform:scale(1.06)}
.msg{font:800 1.5rem var(--display);min-height:1.5em}

/* easel */
.easel{flex:1;align-self:stretch;min-height:0;display:flex;flex-direction:column;gap:10px}
.sheet{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 4px #fff,0 6px 0 var(--line)}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;flex:none}
.tool{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font:22px/1 var(--emoji);flex:none}
.tool.col{border:3px solid #fff}
.tool .dot{border-radius:50%;background:var(--ink)}
.stamps{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;flex:none}
.tools .btn{min-height:46px;padding:4px 16px;font-size:1rem}

/* book, gallery, overlays */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y}
.page{background:var(--paper);border-radius:20px;padding:14px;margin-bottom:14px}
.page h3{margin:0 0 8px;font:800 1.15rem var(--display)}
.stick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.stick span{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--sky);font:34px/1 var(--emoji)}
.stick span.off{font:800 1.3rem var(--display);color:var(--line);background:none;border:2px dashed var(--line)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pics button{border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 5px 0 var(--line);background:#fff}
.pics img{display:block;width:100%}
.over{position:fixed;inset:0;z-index:50;background:rgba(31,48,68,.55);display:grid;place-items:center;padding:20px}
.panel{background:var(--paper);border-radius:28px;padding:24px;width:min(100%,420px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative}
.panel h2{font-size:2.2rem;color:var(--fox-d)}
.panel p{margin:0}
.panel img{max-width:100%;border-radius:12px}
#hand{font:120px/1 var(--emoji);animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
#hand.hit{animation:none;transform:scale(1.15)}
@keyframes wave{50%{transform:rotate(10deg)}}
.got{font:800 1.3rem var(--display)}
.got span{font:46px/1.2 var(--emoji);display:block}
.spark{position:absolute;left:50%;top:42%;font:26px/1 var(--emoji);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800}
.setrow{width:100%}
.vrow{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.vrow p{flex:1;min-width:0;margin:0}
.vrow .round{width:46px;min-height:46px;font-size:1.1rem}
.vrow.has{box-shadow:0 0 0 3px var(--leaf) inset}
.vrow .rec-on{background:#E8556D;color:#fff;box-shadow:0 5px 0 #B73A50}
img.bear,img.cheetah,img.deer,img.baby{width:1em;height:1em;vertical-align:-.14em}
.tool img.bear,.tool img.cheetah,.tool img.deer,.tool img.baby{width:30px;height:30px;vertical-align:middle}
.bankp{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bankp h3{margin:0;font-size:1.4rem}
.jar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:420px;font:34px/1 var(--emoji)}
.jar .off{filter:grayscale(1);opacity:.25}
.cash{font:800 4rem/1 var(--display);color:var(--leaf-d)}
.bills{font:34px/1.2 var(--emoji);word-break:break-all}
#syncIn{font:800 1.3rem var(--display);width:100%;text-align:center;border:3px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink);letter-spacing:.06em;-webkit-user-select:text;user-select:text}
.famcode{font:800 1.7rem var(--display);letter-spacing:.08em;background:var(--sky);border-radius:14px;padding:10px 14px;-webkit-user-select:text;user-select:text}
#gateA{font:800 1.5rem var(--display);width:7ch;text-align:center;border:3px solid var(--line);border-radius:14px;padding:8px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<section class="screen" id="home">
  <button class="btn round" id="gear" aria-label="Settings for grown-ups">⚙️</button>
  <div class="hero" aria-hidden="true"><img class="cheetah" alt=""><img class="baby" alt=""></div>
  <h1>Baby Cheetah</h1>
  <p>Climb the trail. Play a game at every stop.</p>
  <div class="menu">
    <button class="btn go" id="goMap">Play</button>
    <button class="btn purple" id="goStudio">🎨 Art Studio</button>
    <button class="btn sun" id="goAbc">🔤 ABC Letters</button>
    <button class="btn blue" id="goMath">🔢 Math</button>
    <button class="btn green" id="goBook">⭐ Sticker Book</button>
    <button class="btn" id="goBank">🐷 Piggy Bank</button>
  </div>
</section>

<section class="screen" id="map" hidden>
  <div class="bar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>The Trail</h2><span class="stars" id="starCount">⭐ 0</span></div>
  <div id="mapScroll"><div id="trail"></div></div>
</section>

<section class="screen" id="play" hidden>
  <div class="bar"><button class="btn round" id="quit" aria-label="Back to the trail">←</button><div id="hint"></div><button class="btn round" id="speak" aria-label="Read it to me">🔊</button></div>

{const old=ART_SAVED.some(a=>typeof a==='string');ART_SAVED=ART_SAVED.map((a,i)=>typeof a==='string'?{id:'a'+i+'x'+Math.random().toString(36).slice(2,8),u:a,t:Date.now()-i}:a).filter(a=>a&&a.u);if(old)artStore()}
/* ---------- Saving beyond this device ----------

   - the family server (a small service of our own), used when the app was built with its address and this device has a family code;
   - the signed-in Claude account, used only inside Claude, which cannot reach outside servers.
   Both keep one progress record and one record per picture, and both are merged with what is on the device, never just overwritten. */
let remote=null,remoteQ=Promise.resolve(),pushTimer=0,artCol=null;

    for(const d of list){if(S.artGone.includes(d.id)){remote.delArt(d.id).catch(()=>{});continue}seen.add(d.id);
      if(!ART_SAVED.some(a=>a.id===d.id)){const v=await d.load().catch(()=>null);if(v&&typeof v.u==='string'&&v.u.startsWith('data:image/')){ART_SAVED.push({id:d.id,u:v.u,t:+v.t||0});changed=true}}}
    if(ART_SAVED.some(a=>S.artGone.includes(a.id))){ART_SAVED=ART_SAVED.filter(a=>!S.artGone.includes(a.id));changed=true}
    for(const a of ART_SAVED)if(!seen.has(a.id))await remote.putArt(a.id,{u:a.u,t:a.t||0}).catch(()=>{});
    if(changed){ART_SAVED.sort((x,y)=>(y.t||0)-(x.t||0));artStore();if(!$('#pics').hidden)openPics()}}catch(e){}}

const pushRemote=now=>{if(!remote)return;clearTimeout(pushTimer);const go=()=>{const d=JSON.parse(JSON.stringify(S)),r=remote;remoteQ=remoteQ.then(()=>r.putP(d,now===true)).catch(()=>{})};if(now)go();else pushTimer=setTimeout(go,600)};

/* hands the drawing to the phone or tablet's own share sheet (Messages, Mail, AirDrop, Photos...) */
async function sharePic(u){try{const bin=atob(u.split(',')[1]),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
    const name='cheetah-and-bear-drawing.jpg',f=new File([a],name,{type:'image/jpeg'});
    /* 1: the device's own share sheet, in any phone or tablet browser */
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'My drawing'});return}}catch(e){if(e&&e.name==='AbortError')return}
    /* 2: inside Claude, hand the picture to Claude's save step (the share sheet in the Claude phone app, a download on a computer) */
    if(window.claude&&window.claude.use){try{const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:new Blob([a],{type:'image/jpeg'})});toast('Picture saved');return}}catch(e){if(e&&e.code==='declined')return}
      toast('Sharing is not available in this view');return}
    /* 3: an ordinary browser on a computer: download the picture */
    const l=document.createElement('a');l.href=u;l.download=name;document.body.append(l);l.click();l.remove();toast('Picture saved to your downloads')}catch(e){toast('Sharing is not available here')}}

 ['M','moon','🌙','monkey','🐵'],['N','nose','👃','nut','🥜'],['O','octopus','🐙','orange','🍊'],['P','pig','🐷','pizza','🍕'],['Q','queen','👸','question','❓'],['R','rabbit','🐰','rainbow','🌈'],

/* The letter is drawn pale with a dashed edge. Points along the middle of its strokes are ticked off as the finger passes near; at 92% the letter is done,
   so a wobbly or slightly off line still counts but every main part of the letter has to be drawn. */
function tracer(host,ch,onDone){const cv=el('canvas','tracecv'),x=cv.getContext('2d'),me=gen,pts=[];host.append(cv);
  const F=s=>`700 ${s}px Andika,"Baloo 2",sans-serif`;let strokes=[],cur=null,hit=0,done=false,s=300;
  const draw=()=>{const r=Math.min(devicePixelRatio||1,2);s=Math.max(160,Math.min(host.clientWidth,host.clientHeight,560));cv.width=cv.height=Math.round(s*r);cv.style.width=cv.style.height=s+'px';x.setTransform(r,0,0,r,0,0);
    x.fillStyle='#FFFDF7';x.fillRect(0,0,s,s);x.strokeStyle='#BFDCE3';x.lineWidth=2;
    [[.22,0],[.37,1],[.74,0]].forEach(([y,dash])=>{x.setLineDash(dash?[8,8]:[]);x.beginPath();x.moveTo(s*.06,s*y);x.lineTo(s*.94,s*y);x.stroke()});
    x.font=F(s*.74);x.textAlign='center';x.textBaseline='alphabetic';x.fillStyle=done?'#BFE8C8':'#E4EDF0';x.fillText(ch,s/2,s*.74);
    if(!done){x.setLineDash([6,6]);x.strokeStyle='#8FA9B5';x.lineWidth=2;x.strokeText(ch,s/2,s*.74)}x.setLineDash([]);
    x.strokeStyle=done?'#4CA774':'#E8743B';x.lineWidth=s*.07;x.lineCap=x.lineJoin='round';
    strokes.forEach(st=>{if(!st.length)return;x.beginPath();x.moveTo(st[0][0]*s,st[0][1]*s);st.forEach(p=>x.lineTo(p[0]*s+.1,p[1]*s));x.stroke()});
    if(!strokes.length&&pts.length){const p=pts[0];x.fillStyle='#F7B731';x.beginPath();x.arc(p[0]*s,p[1]*s,s*.04,0,7);x.fill();x.strokeStyle='#C98A12';x.lineWidth=3;x.stroke()}};
  const build=()=>{const R=200,m=document.createElement('canvas');m.width=m.height=R;const mx=m.getContext('2d');mx.font=F(R*.74);mx.textAlign='center';mx.textBaseline='alphabetic';mx.fillText(ch,R/2,R*.74);
    const d=mx.getImageData(0,0,R,R).data,on=(q,y)=>q>=0&&y>=0&&q<R&&y<R&&d[(y*R+q)*4+3]>120;
    /* only points in the middle of each stroke count */
    for(let y=2;y<R;y+=5)for(let q=2;q<R;q+=5)if(on(q,y)&&on(q-4,y)&&on(q+4,y)&&on(q,y-4)&&on(q,y+4))pts.push([q/R,y/R,0]);draw()};
  const tick=(nx,ny)=>{for(const p of pts)if(!p[2]&&Math.hypot(p[0]-nx,p[1]-ny)<.08){p[2]=1;hit++}};
  const add=e=>{const r=cv.getBoundingClientRect(),p=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height],l=cur[cur.length-1];
    if(l){const n=Math.max(1,Math.ceil(Math.hypot(p[0]-l[0],p[1]-l[1])/.03));for(let k=1;k<=n;k++)tick(l[0]+(p[0]-l[0])*k/n,l[1]+(p[1]-l[1])*k/n)}else tick(p[0],p[1]);
    cur.push(p);if(pts.length&&hit/pts.length>=.92){done=true;cur=null;draw();onDone()}else draw()};
  cv.onpointerdown=e=>{if(done)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}cur=[];strokes.push(cur);add(e)};
  cv.onpointermove=e=>{if(cur&&!done)add(e)};cv.onpointerup=cv.onpointercancel=()=>cur=null;
  refit=draw;draw();const go=()=>{if(me===gen)build()};
  if(document.fonts&&document.fonts.load)document.fonts.load('700 100px Andika').then(go,go);else go();
  return{clear(){if(done)return;strokes=[];cur=null;hit=0;pts.forEach(p=>p[2]=0);draw()}}}

/* ---------- Math: adding and taking away, from counting dots up to two-digit numbers ---------- */
const MLEVELS=[[1,'Add to 5','2 + 3'],[2,'Add to 10','4 + 5'],[3,'Take away from 5','5 − 2'],[4,'Take away from 10','9 − 4'],[5,'Add to 20','8 + 7'],[6,'Take away from 20','15 − 8'],
  [7,'Big number plus small','23 + 5'],[8,'Big number minus small','37 − 4'],[9,'Add two big numbers','24 + 35'],[10,'Take away big numbers','58 − 23']];
function mathQ(L){const R=(lo,hi)=>lo+rnd(hi-lo+1);let a,b,op='+';
  if(L===1){a=R(1,4);b=R(1,5-a)}else if(L===2){a=R(1,9);b=R(1,10-a)}
  else if(L===3){op='−';a=R(2,5);b=R(1,a)}else if(L===4){op='−';a=R(5,10);b=R(1,a)}
  else if(L===5){a=R(2,9);b=R(Math.max(2,11-a),9)}else if(L===6){op='−';a=R(11,18);b=R(a-9,9)}
  else if(L===7){a=R(10,89);b=R(1,9)}else if(L===8){op='−';a=R(11,99);b=R(1,9)}
  else if(L===9){a=R(10,80);b=R(10,99-a)}else{op='−';a=R(20,99);b=R(10,a)}
  return{a,b,op,ans:op==='+'?a+b:a-b}}
/* a picture of the sum: counting dots for small numbers, tens-bars and ones-cubes for big ones */
function mathPic(q){const pic=el('div','mpic'),small=q.op==='+'?q.a+q.b<=20:q.a<=20;
  if(small){const g=el('div','dots2'),n=q.op==='+'?q.a+q.b:q.a;for(let k=0;k<n;k++)g.append(el('i',q.op==='+'?(k<q.a?'':'b'):(k<q.a-q.b?'':'gone')));pic.append(g)}
  else{const blk=n=>{const d=el('div','blocks');for(let k=0;k<(n/10|0);k++)d.append(el('div','ten'));if(n%10){const o=el('div','ones');for(let k=0;k<n%10;k++)o.append(el('i'));d.append(o)}return d};
    pic.append(blk(q.a),el('b','',q.op),blk(q.b))}
  return pic}
function mathRound(box,L,next,quiet){const q=mathQ(L),eq=el('div','eq'),ans=el('span','q','?');
  eq.append(el('span','',q.a),el('span','',q.op),el('span','',q.b),el('span','','='),ans);
  const o=new Set([q.ans]);for(const c of shuffle([q.ans+1,q.ans-1,q.ans+2,q.ans-2,q.ans+10,q.ans-10,q.op==='+'?q.a-q.b:q.a+q.b,q.a]))if(o.size<4&&c>=0&&c<=109)o.add(c);
  box.append(eq,mathPic(q),choices([...o].sort((x,y)=>x-y),v=>{if(v!==q.ans)return false;ans.textContent=q.ans;ans.className='ok2';say(String(q.ans));return true},next,true));
  if(!quiet)say('What is',String(q.a),q.op==='+'?'plus':'minus',String(q.b))}
function openMath(){leaveGame();show('math');$('#starCount5').textContent='⭐ '+avail();const A=$('#mathArea'),g=el('div','mlev');A.innerHTML='';A.className='scroll';

function mathPlay(L){leaveGame();const A=$('#mathArea'),me=gen;A.innerHTML='';A.className='area';
  rounds(A,5,(box,next)=>mathRound(box,L,next),()=>{if(me!==gen)return;const first=!S.math.includes('m'+L);if(first){S.math.push('m'+L);S.stars++;save()}
    $('#starCount5').textContent='⭐ '+avail();sfx.win();const c=pick(CHEERS);say(c);A.innerHTML='';
    const row=el('div','pick'),lv=el('button','btn','Levels'),again=el('button','btn','Again'),nx=el('button','btn go','Next level');row.append(lv,again);if(L<MLEVELS.length)row.append(nx);

    lv.onclick=()=>{sfx.tap();openMath()};again.onclick=()=>{sfx.tap();mathPlay(L)};nx.onclick=()=>{sfx.tap();mathPlay(L+1)}});

$('#setImport').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!j||j.game!=='baby-cheetah'||!j.progress||!Array.isArray(j.progress.done))throw 0;
    mergeRemote(j.progress);let n=0;
    for(const a of(Array.isArray(j.art)?j.art:[]))if(a&&typeof a.u==='string'&&a.u.startsWith('data:image/')&&/^[A-Za-z0-9]{3,40}$/.test(String(a.id))&&!S.artGone.includes(a.id)&&!ART_SAVED.some(x=>x.id===a.id)){ART_SAVED.push({id:a.id,u:a.u,t:+a.t||0});n++}
    ART_SAVED.sort((x,y)=>(y.t||0)-(x.t||0));artStore();save();drawSettings();toast('Loaded: '+S.stars+' stars and '+n+' new pictures');if(remote)syncNow()}
  catch(err){toast('That file is not a Baby Cheetah saved game')}};
let gateAns=0;
$('#gateNo').onclick=()=>$('#gate').hidden=true;
$('#gateOk').onclick=()=>{if(+$('#gateA').value===gateAns){$('#gate').hidden=true;drawSettings();$('#grown').hidden=false}else{wobble($('#gateA'));$('#gateA').value=''}};
$('#gear').onclick=()=>{const a=6+rnd(4),b=6+rnd(4);gateAns=a*b;$('#gateQ').textContent='What is '+a+' × '+b+'?';$('#gateA').value='';$('#gate').hidden=false};
$('#setSound').onclick=()=>{S.sound=!S.sound;save();drawSettings();sfx.tap()};
$('#setVoice').onclick=()=>{S.voice=!S.voice;save();drawSettings();if(!S.voice)hush()};
/* ---------- Buddy's Voice: record a real voice for every line ---------- */
let micStream=null,recNow=null;
function stopMic(){try{recNow&&recNow.stop()}catch(e){}recNow=null;try{micStream&&micStream.getTracks().forEach(t=>t.stop())}catch(e){}micStream=null}
function openVoice(){leaveGame();show('voice');const L=$('#vcList'),lines=voiceLines();L.innerHTML='';
  const count=()=>$('#vcCount').textContent=lines.filter(t=>clips.has(t)).length+' of '+lines.length;
  $('#vcNote').textContent='Tap the red dot, say the line, then tap it again to stop. A child’s own voice works best. Recordings stay on this device, and any line without one is read by the device voice.';
  lines.forEach(text=>{const row=el('div','vrow'),p=el('p','',text),rec=el('button','btn round','⏺'),play=el('button','btn round','▶'),del=el('button','btn round','✕');
    rec.setAttribute('aria-label','Record');play.setAttribute('aria-label','Play');del.setAttribute('aria-label','Delete recording');
    const sync=()=>{const has=clips.has(text);row.classList.toggle('has',has);play.disabled=del.disabled=!has;count()};
    rec.onclick=async()=>{if(recNow){const mine=recNow.owner===rec;recNow.stop();if(mine)return}
      if(!navigator.mediaDevices||!window.MediaRecorder){$('#vcNote').textContent='Recording is not available here. Open the home-screen app (or the game’s web address in Safari) to record.';return}
      try{micStream=micStream||await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('#vcNote').textContent='The microphone is not available here. Open the home-screen app (or the game’s web address in Safari) and allow the microphone to record.';return}
      hush();const chunks=[];let mr;try{mr=new MediaRecorder(micStream)}catch(e){return}
      mr.owner=rec;recNow=mr;rec.textContent='⏹';rec.classList.add('rec-on');
      mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
      mr.onstop=()=>{if(recNow===mr)recNow=null;clearTimeout(tm);rec.textContent='⏺';rec.classList.remove('rec-on');const b=new Blob(chunks,{type:mr.mimeType||'audio/mp4'});if(b.size>600)putClip(text,b);sync()};
      const tm=setTimeout(()=>{if(mr.state==='recording')mr.stop()},9000);mr.start()};
    play.onclick=()=>{const on=S.voice;S.voice=true;say(text);S.voice=on};
    del.onclick=()=>{delClip(text);sync()};
    row.append(p,rec,play,del);L.append(row);sync()})}
$('#setRec').onclick=()=>{$('#grown').hidden=true;openVoice()};
$('#setWho').onclick=()=>{const vs=voices();if(vs.length<2)return;const c=bestVoice();S.vkid=vs[(vs.indexOf(c)+1)%vs.length].name;save();drawSettings();const on=S.voice;S.voice=true;say('Hi! It’s me! Want to play?');S.voice=on};
$('#setOpen').onclick=()=>{S.open=!S.open;save();drawSettings()};
$('#setReset').onclick=e=>{if(e.target.dataset.arm){delete e.target.dataset.arm;S.done=[];save();drawSettings();openHome();toast('The trail is ready to start again')}else{e.target.dataset.arm=1;e.target.textContent='Tap again to restart. Stars and money stay.'}};
$('#setClose').onclick=()=>{delete $('#setReset').dataset.arm;$('#grown').hidden=true};
$('#picClose').onclick=()=>$('#picView').hidden=true;
$('#goMap').onclick=()=>{sfx.tap();openMap()};$('#goStudio').onclick=()=>{sfx.tap();openStudio()};$('#goBook').onclick=()=>{sfx.tap();openBook()};
$('#goPics').onclick=()=>{leaveGame();openPics()};$('#picsBack').onclick=openStudio;
document.querySelectorAll('[data-go="home"]').forEach(b=>b.onclick=openHome);
document.addEventListener('contextmenu',e=>e.preventDefault());
const boot=d=>{if(d&&d.S&&Array.isArray(d.S.done)){Object.assign(S,d.S);norm();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}openHome();linkCloud();openClips();loadPack();};
const hot=window.claude&&window.claude.hot;
try{hot&&hot.snapshot&&hot.snapshot(()=>({S}))}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
</script>

<script>
/* Home-screen app: stay installed offline, and look for a newer game every time the app is opened. */
(function(){
  if(!('serviceWorker' in navigator)||!/^https?:/.test(location.protocol))return;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  var MINE='e8786bc3dc',last=0;
  function check(){
    if(Date.now()-last<60000)return;last=Date.now();
    fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      var v=j&&j.version,tried='';
      try{tried=sessionStorage.getItem('cbt-tried')||''}catch(e){}
      if(!v||v===MINE||tried===v)return;
      (function go(){ /* only swap versions on the home screen, never in the middle of a game */
        if(document.getElementById('home').hidden){setTimeout(go,3000);return}
        try{sessionStorage.setItem('cbt-tried',v)}catch(e){}
        location.reload();
      })();
    }).catch(function(){});
  }
  check();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script>
