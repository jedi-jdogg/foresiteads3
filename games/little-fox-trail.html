<title>Little Cheetah and Bear Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen app. A calm storybook trail that climbs upward; every stop opens one quiet, full-screen game. Single light look by choice. */
:root{
  --sky:#DDF1F5; --paper:#FFFDF7; --ink:#1F3044; --soft:#5C7186; --line:#BFDCE3;
  --sun:#F7B731; --sun-d:#C98A12; --fox:#E8743B; --fox-d:#B9531F; --leaf:#4CA774; --leaf-d:#357A54; --berry:#7A5CC2; --berry-d:#57409A;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--sky);color:var(--ink);font:600 17px/1.35 var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
.screen{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:8px 22px;border-radius:20px;
  background:var(--paper);box-shadow:0 5px 0 var(--line);font:800 1.15rem var(--display)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.go{background:var(--fox);color:#fff;box-shadow:0 5px 0 var(--fox-d)}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}
.btn.purple{background:var(--berry);color:#fff;box-shadow:0 5px 0 var(--berry-d)}
.btn[disabled]{opacity:.45}
.round{width:52px;min-height:52px;padding:0;border-radius:50%;font-size:1.4rem;flex:none}
.bar{display:flex;align-items:center;gap:12px;flex:none}
.bar h2{font-size:1.5rem;flex:1;min-width:0}
.stars{font:800 1.2rem var(--display);background:var(--paper);border-radius:99px;padding:6px 14px}

/* home */
#home{align-items:center;justify-content:center;text-align:center;gap:18px;background:linear-gradient(#BFE6F2,var(--sky) 55%,#CFEBB8)}
#home .hero{font:88px/1 var(--emoji);white-space:nowrap}
#home h1{font-size:clamp(2.1rem,7.5vw,3.6rem);color:var(--fox-d)}
#home p{margin:0;color:var(--soft);max-width:24ch}
.menu{display:flex;flex-direction:column;gap:14px;width:min(100%,340px)}
.menu .btn{width:100%;font-size:1.35rem;min-height:64px}
#gear{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}

/* map */
#mapScroll{flex:1;min-height:0;overflow-y:auto;border-radius:24px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#trail{position:relative;max-width:560px;margin:0 auto}
#trail svg{position:absolute;inset:0;width:100%;height:100%}
#trail path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-dasharray:2 22;vector-effect:non-scaling-stroke;opacity:.9}
.band{position:absolute;left:0;right:0}
.wname{position:absolute;left:14px;bottom:10px;font:800 1.2rem var(--display);opacity:.75}
.band.dark .wname{color:#fff}
.node{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--paper);border:4px solid #fff;
  box-shadow:0 5px 0 rgba(31,48,68,.25);font:30px/1 var(--emoji);display:grid;place-items:center}
.node.done{background:var(--sun)}
.node.done::after{content:"⭐";position:absolute;right:-10px;top:-10px;font-size:22px}
.node.lock{filter:grayscale(1);opacity:.55}
.node.cur{animation:pulse 2.4s ease-in-out infinite}
.fox{position:absolute;left:50%;top:-42px;transform:translateX(-50%);font-size:34px;white-space:nowrap;pointer-events:none}
.summit{position:absolute;left:50%;top:26px;transform:translateX(-50%);font:54px/1 var(--emoji)}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(31,48,68,.25),0 0 0 10px rgba(255,255,255,.55)}}

/* play */
#hint{flex:1;min-width:0;font:800 1.2rem/1.2 var(--display)}
.area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative}
.area.row{flex-direction:row;gap:28px}
.box{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.dots{display:flex;gap:10px;flex:none}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.dots i.on{background:var(--sun);border-color:var(--sun-d)}
.grid{display:grid;grid-template-columns:repeat(var(--n),var(--c));grid-auto-rows:var(--c);gap:8px;flex:none}
.cell,.hold{width:var(--c);height:var(--c)}
.cell{display:grid;place-items:center;font:calc(var(--c)*.6)/1 var(--emoji);border-radius:18%}
.card{background:var(--berry);box-shadow:0 4px 0 var(--berry-d)}
.card span{visibility:hidden}
.card.up{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.card.up span{visibility:visible}
.card.ok,.ok{background:#E3F4DC;box-shadow:0 0 0 3px var(--leaf) inset}
.slot{background:rgba(255,255,255,.55);border:3px dashed var(--line);position:relative}
.sil{filter:brightness(0);opacity:.3}
.piece{position:relative;background:var(--paper);box-shadow:0 4px 0 var(--line);cursor:grab;transition:transform .18s;touch-action:none}
.piece.drag{transition:none;z-index:20;box-shadow:0 10px 18px rgba(31,48,68,.25)}
.board{gap:0;background:var(--paper);border-radius:10px;box-shadow:0 0 0 4px #fff}
.board .slot{border:1px dashed var(--line);border-radius:0;background:none}
.ghost{position:absolute;inset:0;opacity:.28}
.tile{border-radius:6px;background-color:var(--paper);background-repeat:no-repeat}
.board .tile{box-shadow:none;border-radius:0}
.bins{display:flex;gap:10px;width:100%;max-width:760px;flex:none}
.bin{flex:1;min-width:0;min-height:calc(var(--c)*1.7);background:var(--paper);border:3px dashed var(--line);border-radius:18px;padding:6px;text-align:center}
.bin b{display:block;font:800 1rem/1.1 var(--display)}
.binin{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding-top:4px}
.mini{width:calc(var(--c)*.5);height:calc(var(--c)*.5);font-size:calc(var(--c)*.36);box-shadow:none;background:none}
.hole{background:var(--paper);border:3px dashed var(--fox);font-family:var(--display);color:var(--fox)}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choice{width:clamp(64px,19vmin,104px);height:clamp(64px,19vmin,104px);border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--line);
  font:clamp(34px,10vmin,56px)/1 var(--emoji);display:grid;place-items:center}
.choice.num{font-family:var(--display);font-weight:800}
.tap{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.no{animation:wob .4s}
@keyframes wob{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scatter{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;max-width:560px;font:clamp(30px,8vmin,54px)/1.1 var(--emoji)}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:240px;padding:8px;border-radius:16px;background:rgba(255,255,255,.6)}
.scatter b{font:800 1.2em var(--display)}
.dotsvg{touch-action:none;background:var(--paper);border-radius:24px;flex:none}
.dfill{fill:var(--sun);opacity:0;transition:opacity .8s}
.dfill.on{opacity:.85}
.dline{fill:none;stroke:var(--fox);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.drub{stroke:var(--fox);stroke-width:1;stroke-dasharray:2 2;opacity:.6}
.dot circle{fill:var(--paper);stroke:var(--ink);stroke-width:.6}
.dot text{font:800 4.4px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.dot.on circle{fill:var(--fox);stroke:var(--fox-d)}
.dot.on text{fill:#fff}
.dot.next circle{fill:var(--sun);stroke-width:1}
.mazecv{touch-action:none;border-radius:16px;flex:none}
.mos{gap:2px;touch-action:none}
.px{background:var(--paper);border-radius:4px;font:800 calc(var(--c)*.45)/1 var(--display);color:var(--soft)}
.pal{display:flex;gap:14px;flex:none}
.sw{width:60px;height:60px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.sw i{font:800 1.1rem var(--display);font-style:normal;background:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.sw.sel,.tool.sel{outline:4px solid var(--ink);outline-offset:2px}
.pad{border-radius:26%;opacity:.55;box-shadow:0 6px 0 rgba(31,48,68,.2);transition:opacity .15s,transform .15s}
.pad.lit{opacity:1;transform:scale(1.06)}
.msg{font:800 1.5rem var(--display);min-height:1.5em}

/* easel */
.easel{flex:1;align-self:stretch;min-height:0;display:flex;flex-direction:column;gap:10px}
.sheet{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 4px #fff,0 6px 0 var(--line)}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;flex:none}
.tool{width:44px;height:44px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;font:22px/1 var(--emoji);flex:none}
.tool.col{border:3px solid #fff}
.tool .dot{border-radius:50%;background:var(--ink)}
.stamps{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;flex:none}
.tools .btn{min-height:46px;padding:4px 16px;font-size:1rem}

/* book, gallery, overlays */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y}
.page{background:var(--paper);border-radius:20px;padding:14px;margin-bottom:14px}
.page h3{margin:0 0 8px;font:800 1.15rem var(--display)}
.stick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.stick span{aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:var(--sky);font:34px/1 var(--emoji)}
.stick span.off{font:800 1.3rem var(--display);color:var(--line);background:none;border:2px dashed var(--line)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pics button{border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 5px 0 var(--line);background:#fff}
.pics img{display:block;width:100%}
.over{position:fixed;inset:0;z-index:50;background:rgba(31,48,68,.55);display:grid;place-items:center;padding:20px}
.panel{background:var(--paper);border-radius:28px;padding:24px;width:min(100%,420px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative}
.panel h2{font-size:2.2rem;color:var(--fox-d)}
.panel p{margin:0}
.panel img{max-width:100%;border-radius:12px}
#hand{font:120px/1 var(--emoji);animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
#hand.hit{animation:none;transform:scale(1.15)}
@keyframes wave{50%{transform:rotate(10deg)}}
.got{font:800 1.3rem var(--display)}
.got span{font:46px/1.2 var(--emoji);display:block}
.spark{position:absolute;left:50%;top:42%;font:26px/1 var(--emoji);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800}
.setrow{width:100%}
img.bear{width:1em;height:1em;vertical-align:-.14em}
.tool img.bear{width:28px;height:28px;vertical-align:middle}
.bankp{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bankp h3{margin:0;font-size:1.4rem}
.jar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:420px;font:34px/1 var(--emoji)}
.jar .off{filter:grayscale(1);opacity:.25}
.cash{font:800 4rem/1 var(--display);color:var(--leaf-d)}
.bills{font:34px/1.2 var(--emoji);word-break:break-all}
#gateA{font:800 1.5rem var(--display);width:7ch;text-align:center;border:3px solid var(--line);border-radius:14px;padding:8px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section class="screen" id="home">
  <button class="btn round" id="gear" aria-label="Settings for grown-ups">⚙️</button>
  <div class="hero" aria-hidden="true">🐆<img class="bear" alt=""></div>
  <h1>Little Cheetah and Bear Trail</h1>
  <p>Climb the trail. Play a game at every stop.</p>
  <div class="menu">
    <button class="btn go" id="goMap">Play</button>
    <button class="btn purple" id="goStudio">🎨 Art Studio</button>
    <button class="btn green" id="goBook">⭐ Sticker Book</button>
    <button class="btn" id="goBank">🐷 Piggy Bank</button>
  </div>
</section>

<section class="screen" id="map" hidden>
  <div class="bar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>The Trail</h2><span class="stars" id="starCount">⭐ 0</span></div>
  <div id="mapScroll"><div id="trail"></div></div>
</section>

<section class="screen" id="play" hidden>
  <div class="bar"><button class="btn round" id="quit" aria-label="Back to the trail">←</button><div id="hint"></div><button class="btn round" id="speak" aria-label="Read it to me">🔊</button></div>
  <div class="area" id="area"></div>
</section>

<section class="screen" id="studio" hidden>
  <div class="bar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>Art Studio</h2><button class="btn" id="goPics">🖼️ My Pictures</button></div>
  <div class="area" id="studioHost"></div>
</section>

<section class="screen" id="pics" hidden>
  <div class="bar"><button class="btn round" id="picsBack" aria-label="Back to the studio">←</button><h2>My Pictures</h2></div>
  <div class="scroll"><div class="pics" id="picGrid"></div></div>
</section>

<section class="screen" id="book" hidden>
  <div class="bar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>Sticker Book</h2><span class="stars" id="starCount2">⭐ 0</span></div>
  <div class="scroll" id="bookPages"></div>
</section>

<section class="screen" id="bank" hidden>
  <div class="bar"><button class="btn round" data-go="home" aria-label="Home">🏠</button><h2>Piggy Bank</h2><span class="stars" id="starCount3">⭐ 0</span></div>
  <div class="scroll">
    <div class="page bankp"><h3 id="bkRate"></h3><div class="jar" id="bkJar"></div><button class="btn go" id="bkTrade"></button></div>
    <div class="page bankp"><h3>My money</h3><div class="cash" id="bkCash">$0</div><div class="bills" id="bkBills"></div><p id="bkNote"></p></div>
  </div>
</section>

<div class="over" id="reward" hidden><div class="panel">
  <h2 id="rwT">You did it!</h2>
  <button id="hand" aria-label="High five">✋</button>
  <p id="rwP">Give me a high five!</p>
  <div id="rwGot" hidden></div>
  <button class="btn go" id="rwNext" hidden>Keep going</button>
</div></div>

<div class="over" id="grown" hidden><div class="panel">
  <h2 style="font-size:1.6rem">For grown-ups</h2>
  <button class="btn setrow" id="setSound"></button>
  <button class="btn setrow" id="setVoice"></button>
  <button class="btn setrow" id="setWho"></button>
  <button class="btn setrow" id="setOpen"></button>
  <button class="btn setrow" id="setRate"></button>
  <button class="btn setrow" id="setCap"></button>
  <button class="btn setrow" id="setPay"></button>
  <button class="btn setrow" id="setReset">Start the trail over</button>
  <button class="btn go setrow" id="setClose">Done</button>
</div></div>

<div class="over" id="gate" hidden><div class="panel">
  <h2 style="font-size:1.6rem">Grown-ups only</h2>
  <p id="gateQ"></p>
  <input id="gateA" inputmode="numeric" autocomplete="off" aria-label="Answer">
  <div style="display:flex;gap:12px"><button class="btn" id="gateNo">Back</button><button class="btn go" id="gateOk">Open</button></div>
</div></div>

<div class="over" id="picView" hidden><div class="panel">
  <img id="picBig" alt="A saved drawing">
  <div style="display:flex;gap:12px"><button class="btn" id="picDel">Remove</button><button class="btn go" id="picClose">Close</button></div>
</div></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* the bear buddy is drawn here, white with light brown accents, because no emoji looks like that */
const BEAR='bear';
const BEAR_URL='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><g stroke="#C9A27A" stroke-width="3" fill="#FFFFFF"><circle cx="24" cy="27" r="15"/><circle cx="76" cy="27" r="15"/></g><circle cx="24" cy="27" r="8" fill="#E8CBA8"/><circle cx="76" cy="27" r="8" fill="#E8CBA8"/><ellipse cx="50" cy="56" rx="40" ry="36" fill="#FFFFFF" stroke="#C9A27A" stroke-width="3"/><circle cx="24" cy="66" r="6" fill="#F5DCC6"/><circle cx="76" cy="66" r="6" fill="#F5DCC6"/><ellipse cx="50" cy="69" rx="17" ry="13" fill="#F6E7D3"/><ellipse cx="50" cy="62" rx="7" ry="5" fill="#B5835A"/><path d="M50 67v5M50 72q-6 6-11 1M50 72q6 6 11 1" fill="none" stroke="#B5835A" stroke-width="2.5" stroke-linecap="round"/><circle cx="34" cy="50" r="4.5" fill="#A87850"/><circle cx="66" cy="50" r="4.5" fill="#A87850"/></svg>');
const bearImg=new Image();bearImg.onload=()=>refit&&refit();bearImg.src=BEAR_URL;
const bearEl=()=>{const i=el('img','bear');i.src=BEAR_URL;i.alt='';return i};
const icon=(n,e)=>{n.textContent='';if(e===BEAR)n.append(bearEl());else n.textContent=e;return n};
const buddy=n=>{n.append('🐆',bearEl());return n};
document.querySelectorAll('img.bear').forEach(i=>i.src=BEAR_URL);

/* ---------- saved progress (this device only) ---------- */
const KEY='little-fox-trail-v1';
let S={done:[],sound:true,voice:true,open:false};
let ART_SAVED=[];
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
/* stars are earned at stops and traded for dollars in the Piggy Bank; cash and paidOut are in cents */
function norm(){if(!Array.isArray(S.done))S.done=[];if(typeof S.stars!=='number')S.stars=S.done.length;for(const k of['spent','cash','paidOut'])S[k]=S[k]||0;S.rate=S.rate||10;if(S.replayCap==null)S.replayCap=5}
norm();
const avail=()=>Math.max(0,S.stars-S.spent),usd=c=>'$'+Math.round(c/100);
try{ART_SAVED=JSON.parse(localStorage.getItem(KEY+'-art')||'[]')}catch(e){}
/* progress is also kept with the signed-in account when the page is hosted in Claude, so a reload or another device keeps the stars */
let cloud=null,cloudQ=Promise.resolve();
const pushCloud=()=>{if(!cloud)return;const d=JSON.parse(JSON.stringify(S));cloudQ=cloudQ.then(()=>cloud.set(d)).catch(()=>{})};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushCloud()};
async function linkCloud(){try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db'),user=await window.claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;const ref=db.collection('data/users/'+id).doc('progress'),snap=await ref.get(),c=snap.exists?snap.data():null;cloud=ref;
  if(c&&Array.isArray(c.done)){const merged=[...new Set([...c.done,...S.done])].filter(n=>Number.isInteger(n)&&n>=0&&n<N);let grew=merged.length>S.done.length;S.done=merged;for(const k of['stars','spent','cash','paidOut']){const m=Math.max(S[k]||0,+c[k]||0);if(m!==S[k]){S[k]=m;grew=true}}
    if(c.stars==null&&S.stars<merged.length){S.stars=merged.length;grew=true}if(c.rate&&c.rate!==S.rate){S.rate=c.rate;grew=true}if(c.replayCap!=null)S.replayCap=c.replayCap;

  a.append(g,pal);fit(n,n+1.8,72,2);return 'Pick a color. Paint the squares that have the same number.'},

echo(a,d,w,win){const np=d<1?3:4,target=[3,4,5,6,7][d],cols=['#E8556D','#3F7FD1','#F7C948','#4CA774'],fr=[262,330,392,523],me=gen,alive=()=>me===gen;
  const msg=el('div','msg','Watch…'),pads=el('div','grid');pads.style.setProperty('--n',np===3?3:2);
  let seq=[rnd(np),rnd(np)],inp=0,lock=true;
  const lit=async i=>{ps[i].classList.add('lit');tone(fr[i],.35);await wait(450);ps[i].classList.remove('lit');await wait(220)};
  const play=async()=>{lock=true;msg.textContent='Watch…';await wait(800);for(const i of seq){if(!alive())return;await lit(i)}if(!alive())return;msg.textContent='Your turn!';inp=0;lock=false};
  const tap=async i=>{if(lock)return;lit(i);
    if(i!==seq[inp]){lock=true;msg.textContent='Let’s watch again.';await wait(1100);if(alive())play();return}
    if(++inp===seq.length){lock=true;if(seq.length>=target){win();return}msg.textContent='Yes!';await wait(900);seq.push(rnd(np));if(alive())play()}};
  const ps=[...Array(np)].map((_,i)=>{const b=el('button','cell pad');b.style.background=cols[i];b.setAttribute('aria-label','Light '+(i+1));b.onclick=()=>tap(i);pads.append(b);return b});
  a.append(msg,pads);np===3?fit(3,1.8,150):fit(2,2.8,170);play();return 'Watch the lights. Then tap them in the same order.'},

draw(a,d,w,win){easel(a,{done:url=>{saveArt(url);win()}});return w.draw}
};

/* dot-to-dot shapes on a 100 x 100 sheet */
const star=k=>[...Array(k*2)].map((_,i)=>{const r=i%2?22:44,t=Math.PI*i/k-Math.PI/2;return[+(50+r*Math.cos(t)).toFixed(1),+(50+r*Math.sin(t)).toFixed(1)]});
const heart=n=>[...Array(n)].map((_,i)=>{const t=2*Math.PI*i/n;return[+(50+41*Math.pow(Math.sin(t),3)).toFixed(1),+(46-2.6*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))).toFixed(1)]});

/* a picture for the puzzle: sky, sun, hills, and one friend in every tile */
function scene(w,cols,rows){const c=document.createElement('canvas'),W=c.width=720,H=c.height=Math.round(720*rows/cols),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,w.dark?'#1F2A52':'#8FD0EE');g.addColorStop(1,w.dark?'#6A57B0':'#FDF3C8');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle=w.dark?'#FFF3B0':'#F7B731';x.beginPath();x.arc(W*.82,H*.16,H*.1,0,7);x.fill();
  x.fillStyle=w.hill;x.beginPath();x.ellipse(W*.25,H*1.02,W*.5,H*.34,0,0,7);x.fill();x.globalAlpha=.8;x.beginPath();x.ellipse(W*.8,H*1.05,W*.5,H*.3,0,0,7);x.fill();x.globalAlpha=1;
  x.textAlign='center';x.textBaseline='middle';const ems=shuffle([...w.em,'🐆',...w.em]),tw=W/cols,th=H/rows;x.font=`${Math.min(tw,th)*.56}px serif`;
  for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)x.fillText(ems[(r*cols+q)%ems.length],(q+.3+Math.random()*.4)*tw,(r+.35+Math.random()*.35)*th);
  return c.toDataURL('image/jpeg',.85)}

/* ---------- drawing board, shared by drawing missions and the Art Studio ---------- */
function easel(host,{done,studio}){const wrap=el('div','easel'),sheet=el('div','sheet'),cv=el('canvas'),bar=el('div','tools'),stampRow=el('div','stamps');
  sheet.append(cv);wrap.append(sheet,stampRow,bar);host.append(wrap);stampRow.hidden=true;
  const x=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,1.5);let color='#1F3044',size=10,mode='pen',mirror=false,stamp='⭐',hue=0,undo=[],last=null,ready=false,marks=0;
  const resize=()=>{const r=sheet.getBoundingClientRect(),W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);if(!W||!H||(W===cv.width&&H===cv.height))return;
    const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;if(ready)old.getContext('2d').drawImage(cv,0,0);
    cv.width=W;cv.height=H;x.fillStyle='#fff';x.fillRect(0,0,W,H);if(ready)x.drawImage(old,0,0,W,H);ready=true;undo=[]};
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  const seg=(p,q)=>{x.lineCap=x.lineJoin='round';x.lineWidth=size*dpr*(mode==='erase'?2:1);x.strokeStyle=mode==='erase'?'#fff':mode==='rainbow'?`hsl(${hue=(hue+4)%360} 85% 55%)`:color;
    const ln=(u,v)=>{x.beginPath();x.moveTo(u[0],u[1]);x.lineTo(v[0],v[1]);x.stroke()};ln(p,q);if(mirror)ln([cv.width-p[0],p[1]],[cv.width-q[0],q[1]])};
  const put=p=>{x.font=`${size*5*dpr}px serif`;x.textAlign='center';x.textBaseline='middle';const z=size*5*dpr,one=(u,v)=>stamp===BEAR?x.drawImage(bearImg,u-z/2,v-z/2,z,z):x.fillText(stamp,u,v);one(p[0],p[1]);if(mirror)one(cv.width-p[0],p[1])};
  const snap=()=>{try{undo.push(x.getImageData(0,0,cv.width,cv.height));if(undo.length>5)undo.shift()}catch(e){}};
  cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}snap();marks++;if(doneBtn)doneBtn.disabled=false;const p=pt(e);
    if(mode==='stamp'){put(p);sfx.tap()}else{last=p;seg(p,[p[0]+.1,p[1]+.1])}};
  cv.onpointermove=e=>{if(!last)return;const p=pt(e);seg(last,p);last=p};cv.onpointerup=cv.onpointercancel=()=>last=null;
  const thumb=()=>{const t=document.createElement('canvas');t.width=480;t.height=Math.round(480*cv.height/cv.width);t.getContext('2d').drawImage(cv,0,0,t.width,t.height);return t.toDataURL('image/jpeg',.8)};
  const tools=[];const tool=(label,html,on,cls)=>{const b=el('button','tool'+(cls?' '+cls:''));b.setAttribute('aria-label',label);if(typeof html==='string')b.textContent=html;else if(html)b.append(html);b.onclick=()=>{sfx.tap();on(b)};bar.append(b);tools.push(b);return b};
  const mark=()=>tools.forEach(b=>b.classList.toggle('sel',b.dataset.m===mode&&(mode!=='pen'||b.dataset.c===color)||b.dataset.s==size||(b.dataset.m==='mirror'&&mirror)));
  ['#1F3044','#E8556D','#F28B30','#F7C948','#4CA774','#3F7FD1','#7A5CC2','#F28BB3','#8A5A3C','#6CC5E0'].forEach(c=>{const b=tool('Color','',()=>{color=c;mode='pen';stampRow.hidden=true;mark()},'col');b.style.background=c;b.dataset.m='pen';b.dataset.c=c});
  [5,10,22].forEach(s=>{const dot=el('span','dot');dot.style.width=dot.style.height=(s*.9+6)+'px';tool('Brush size',dot,()=>{size=s;mark()}).dataset.s=s});
  tool('Rainbow brush','🌈',()=>{mode='rainbow';stampRow.hidden=true;mark()}).dataset.m='rainbow';
  tool('Eraser','🧽',()=>{mode='erase';stampRow.hidden=true;mark()}).dataset.m='erase';
  tool('Mirror drawing','🦋',()=>{mirror=!mirror;mark()}).dataset.m='mirror';
  const stampBtn=tool('Stickers',stamp,()=>{mode='stamp';stampRow.hidden=false;mark();resize()});stampBtn.dataset.m='stamp';
  [...new Set(['⭐','❤️','🐆',BEAR,...S.done.map(stickerOf)])].forEach(e=>{const b=icon(el('button','tool'),e);b.onclick=()=>{stamp=e;icon(stampBtn,e);mode='stamp';sfx.tap();mark()};stampRow.append(b)});
  tool('Undo','↩️',()=>{const u=undo.pop();if(u)x.putImageData(u,0,0)});
  tool('Clear the page','🗑️',()=>{snap();x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height)});
  let doneBtn=null;
  if(studio){const b=el('button','btn green','Save');b.onclick=()=>{saveArt(thumb());sfx.good();toast('Saved to My Pictures')};bar.append(b)}
  else{doneBtn=el('button','btn green','I’m done');doneBtn.disabled=true;doneBtn.onclick=()=>{if(marks)done(thumb())};bar.append(doneBtn)}
  mark();resize();const ro=()=>resize();addEventListener('resize',ro);const prev=cleanup;cleanup=()=>{removeEventListener('resize',ro);prev&&prev()};
  requestAnimationFrame(resize)}

/* ---------- starting and finishing a mission ---------- */
function startLevel(i){leaveGame();curLevel=i;const w=WORLDS[i>>3],t=w.types[i&7],me=gen;show('play');area.innerHTML='';area.className='area';
  let won=false;curHint=GAMES[t](area,i>>3,w,()=>{if(won||me!==gen)return;won=true;setTimeout(()=>me===gen&&reward(i),700)});
  $('#hint').textContent=curHint;say(pick(OPENERS)+' '+curHint)}
function reward(i){const first=!S.done.includes(i);let star=first;
  if(first)S.done.push(i);else{const day=new Date().toDateString();if(!S.replay||S.replay.day!==day)S.replay={day,n:0};if(S.replay.n<S.replayCap){S.replay.n++;star=true}}
  if(star)S.stars++;save();
  const cheer=pick(CHEERS);sfx.win();$('#rwT').textContent=cheer;$('#rwP').textContent='Give me a high five!';$('#rwP').hidden=false;$('#hand').className='';$('#hand').hidden=false;$('#rwGot').hidden=true;$('#rwNext').hidden=true;
  $('#reward').hidden=false;say(cheer+' Give me a high five!');
  $('#hand').onclick=()=>{$('#hand').onclick=null;$('#hand').className='hit';sfx.clap();setTimeout(sfx.good,200);
    const panel=$('#reward .panel');for(let k=0;k<12;k++){const s=el('span','spark','⭐'),an=Math.PI*2*k/12;s.style.setProperty('--dx',Math.cos(an)*150+'px');s.style.setProperty('--dy',Math.sin(an)*150+'px');panel.append(s);setTimeout(()=>s.remove(),1000)}
    setTimeout(()=>{const got=$('#rwGot');got.innerHTML='';got.className='got';$('#hand').hidden=true;$('#rwP').hidden=true;$('#rwT').textContent='High five!';
      const w=WORLDS[i>>3],top=S.done.length>=N;
      if(first){got.append(el('span','',stickerOf(i)),document.createTextNode('A gold star and a new sticker!'));
        if((i&7)===7)got.append(el('span','','🏆'),document.createTextNode(top?'You reached the top of the trail!':'You finished '+w.name+'!'))}
      else got.append(el('span','',star?'⭐':'🐆'),document.createTextNode(star?'Another gold star!':'Great playing!'));
      got.hidden=false;$('#rwNext').hidden=false;say(!first?(star?'High five! Another gold star for you!':'High five! That was great playing!'):(i&7)!==7?'High five! You earned a gold star and a new sticker!':top?'High five! You reached the very top of the trail! I am so proud of you!':'High five! You finished '+w.name+'! Here is your trophy!')},700)}}
$('#rwNext').onclick=()=>{$('#reward').hidden=true;leaveGame();openMap()};
$('#quit').onclick=()=>{leaveGame();openMap()};
$('#speak').onclick=()=>{const v=S.voice;S.voice=true;say(curHint);S.voice=v};

/* ---------- the trail ---------- */
function openMap(){show('map');const STEP=104,H=N*STEP+170,y=i=>H-90-i*STEP,xp=t=>50+30*Math.sin(t*.8),T=$('#trail'),cur=nextLevel();
  T.innerHTML='';T.style.height=H+'px';T.style.background=`linear-gradient(${WORLDS[WORLDS.length-1].bg} 50%,${WORLDS[0].bg} 50%)`;
  WORLDS.forEach((w,k)=>{const b=el('div','band'+(w.dark?' dark':''));b.style.top=(y(8*k+7)-STEP/2)+'px';b.style.height=8*STEP+'px';b.style.background=w.bg;
    b.append(el('span','wname',(S.done.includes(8*k+7)?'🏆 ':'')+w.name));T.append(b)});
  let dp='';for(let t=0;t<=N-1;t+=.1)dp+=(dp?'L':'M')+xp(t).toFixed(2)+' '+y(t).toFixed(1);
  T.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${dp}"/></svg>`);
  T.append(cur>=N?buddy(el('div','summit')):el('div','summit','🏁'));
  for(let i=0;i<N;i++){const t=WORLDS[i>>3].types[i&7],b=el('button','node',S.done.includes(i)?stickerOf(i):TYPES[t]),lock=i>cur&&!S.open;
    b.style.left=xp(i)+'%';b.style.top=y(i)+'px';b.setAttribute('aria-label',`Stop ${i+1}: ${NAMES[t]}`);
    if(S.done.includes(i))b.classList.add('done');if(lock){b.classList.add('lock');b.disabled=true}
    if(i===cur){b.classList.add('cur');b.append(buddy(el('span','fox')))}
    b.onclick=()=>{sfx.tap();startLevel(i)};T.append(b)}
  $('#starCount').textContent='⭐ '+avail();
  const sc=$('#mapScroll');sc.scrollTop=y(Math.min(cur,N-1))-sc.clientHeight/2}

function openBook(){show('book');$('#starCount2').textContent='⭐ '+avail();const P=$('#bookPages');P.innerHTML='';
  WORLDS.forEach((w,k)=>{const pg=el('div','page'),g=el('div','stick');pg.append(el('h3','',(S.done.includes(8*k+7)?'🏆 ':'')+w.name),g);

  if(!ART_SAVED.length)g.append(el('p','','No pictures yet. Draw one in the Art Studio and tap Save.'));

    b.onclick=()=>{$('#picBig').src=u;$('#picView').hidden=false;const d=$('#picDel');d.textContent='Remove';let armed=false;
      d.onclick=()=>{if(!armed){armed=true;d.textContent='Tap again to remove';return}ART_SAVED.splice(i,1);try{localStorage.setItem(KEY+'-art',JSON.stringify(ART_SAVED))}catch(e){}$('#picView').hidden=true;openPics()}};g.append(b)})}
function openBank(){leaveGame();show('bank');const a=avail(),r=S.rate,owed=S.cash-S.paidOut,unit=r+(r===1?' star':' stars');$('#starCount3').textContent='⭐ '+a;
  $('#bkRate').textContent=unit+' = $1';const j=$('#bkJar');j.innerHTML='';for(let k=0;k<r;k++)j.append(el('span',k<a?'':'off','⭐'));

  $('#setRate').textContent='Trade rate: '+S.rate+(S.rate===1?' star':' stars')+' = $1';$('#setCap').textContent=S.replayCap?'Replay stars: up to '+S.replayCap+' a day':'Replay stars: off';

$('#gateNo').onclick=()=>$('#gate').hidden=true;
